
name: Iris MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib

      - name: Check Python files
        run: |
          python -m py_compile train.py retrain.py test_new_data.py iris_mlops_epochs.py

      - name: Train neural network
        run: python train.py

      - name: Verify saved model
        run: |
          python -c "import os; assert os.path.isfile('iris_model.pkl'), 'Model file was not created'; print('Model file created successfully')"
      - name: Evaluate model accuracy
        run: python evaluate_model.py
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: iris-neural-network-model
          path: iris_model.pkl
          retention-days: 7
